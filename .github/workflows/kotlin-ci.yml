name: Kotlin CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'kotlin/**'
      - '.github/workflows/kotlin-ci.yml'

permissions:
  contents: read

jobs:
  kotlin-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kotlin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 9.7.1
      - name: Test
        run: gradle spotlessCheck test --no-daemon
